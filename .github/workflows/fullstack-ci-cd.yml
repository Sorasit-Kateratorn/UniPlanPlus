name: Fullstack CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  dependency-governance:
    name: SBOM and dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify SBOM inventory
        run: python3 scripts/check_sbom.py

      - name: Audit Python packages from PyPI
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install --index-url https://pypi.org/simple pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Audit npm packages
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  backend-tests:
    name: Backend tests (Django + Pytest)
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: uniplan
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: uniplan
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DEBUG: "1"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      DJANGO_SECRET: test-secret-key-for-ci-only-32-bytes-minimum
      GOOGLE_CLIENT_ID: fake
      GOOGLE_CLIENT_SECRET: fake
      GOOGLE_REDIRECT_URI: http://localhost/dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install --index-url https://pypi.org/simple -r requirements.txt
          pip install --index-url https://pypi.org/simple pytest pytest-django

      - name: Soft lint backend (Ruff)
        working-directory: backend
        run: |
          echo "::group::Backend Lint"
          ruff check . || true
          echo "::endgroup::"

      - name: Wait for MySQL
        run: |
          for i in {1..20}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent; then
              echo "MySQL is up";
              break;
            fi
            echo "Waiting for MySQL..."
            sleep 3
          done

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Soft lint frontend (ESLint)
        working-directory: frontend
        run: |
          echo "::group::Frontend Lint"
          npm run lint || true
          echo "::endgroup::"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

  build-and-push-images:
    name: Build & push Docker images (backend + frontend)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - dependency-governance
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/uniplan-backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/uniplan-frontend:latest
